name: Trello-Status synchronisieren

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-trello-card:
    name: Trello-Status synchronisieren
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: E-Mail-Logik mit Testdaten prüfen
        run: python -m unittest discover -s Tests/TrelloSync -p "test_*.py" -v

      - name: Entwicklungsbericht an Trello-Karte senden
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TRELLO_CARD_EMAIL: ${{ secrets.TRELLO_CARD_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL || 'true' }}
        run: python .github/scripts/send_trello_report.py
